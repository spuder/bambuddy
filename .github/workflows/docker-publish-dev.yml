name: Publish dev Docker image

# Ad-hoc, manually-dispatched image publish for local testing. Deliberately
# kept off feature branches (lives only on ci/docker-dev-build) so it never
# shows up in a PR diff if a feature branch is later contributed upstream.
# Pass the branch/tag/sha to build via the `ref` input — the workflow
# checks that out explicitly rather than building its own branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build'
        required: true
        default: 'claude/build-plate-selector'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Compute tags
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch_slug=$(echo '${{ inputs.ref }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bambuddy:dev-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/bambuddy:dev-${{ steps.vars.outputs.branch_slug }}

      - name: Summary
        run: |
          echo "### Published dev image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository_owner }}/bambuddy:dev-${{ steps.vars.outputs.sha_short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository_owner }}/bambuddy:dev-${{ steps.vars.outputs.branch_slug }}\`" >> "$GITHUB_STEP_SUMMARY"
