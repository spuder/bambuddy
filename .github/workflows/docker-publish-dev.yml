name: Publish dev Docker image

# Ad-hoc image publish for local testing. Deliberately kept off feature
# branches (lives only on ci/docker-dev-build) so it never shows up in a PR
# diff if a feature branch is later contributed upstream.
#
# Triggered by push to THIS branch rather than workflow_dispatch: dispatch
# only becomes available once a workflow file exists on the repo's default
# branch, which would mean adding it to main. Push avoids that entirely —
# every push to ci/docker-dev-build rebuilds TARGET_REF below. To build a
# different branch, edit TARGET_REF and push again.

on:
  push:
    branches:
      - ci/docker-dev-build

env:
  TARGET_REF: claude/build-plate-selector

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Compute tags
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch_slug=$(echo "$TARGET_REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bambuddy:dev-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/bambuddy:dev-${{ steps.vars.outputs.branch_slug }}

      - name: Summary
        run: |
          echo "### Published dev image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository_owner }}/bambuddy:dev-${{ steps.vars.outputs.sha_short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository_owner }}/bambuddy:dev-${{ steps.vars.outputs.branch_slug }}\`" >> "$GITHUB_STEP_SUMMARY"
